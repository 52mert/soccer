name: Mert Skor - Mac Guncelleme Cron

on:
  schedule:
    # TR 12:00 ve 15:00 → listeyi hazırla
    - cron: "0 9,12 * * *"
    
    # TR 18:00 - 02:30 → maç saatleri (15 dk'da bir)
    - cron: "*/15 15-23 * * *"

    # TR 03:10 → son güncelleme
    - cron: "10 0 * * *"

  workflow_dispatch:

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Vercel API Tetikle
        run: |
          curl -X GET "https://soccer2-ashen.vercel.app/api/fetch-matches" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
